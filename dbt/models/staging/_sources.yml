version: 2

sources:
  - name: raw_pypi
    database: ancient-voltage-258310
    schema: raw_pypi
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: downloads_agg
        description: >
          PyPI downloads from the public BigQuery table, aggregated at ingest to
          date x package x version x installer x country x Python minor x CI flag.
          The ingest replaces the last 3 days on every run.

  - name: raw_pypistats
    database: ancient-voltage-258310
    schema: raw_pypistats
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: overall
        description: >
          pypistats.org /overall endpoint, last 180 days per pull. Every pull is
          appended, so the same date appears once per pull.

  - name: raw_npm
    database: ancient-voltage-258310
    schema: raw_npm
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: downloads_daily
        description: >
          npm range endpoint, 1 row per date x package. The ingest replaces the
          last 7 days on every run and drops trailing days that npm hasn't counted yet.
          npm sometimes reports 0 for every package on a day it lost.

  - name: raw_fred
    database: ancient-voltage-258310
    schema: raw_fred
    tables:
      - name: ramp_ai
        description: >
          Ramp AI Index from FRED, every vintage. 1 row per series x month x
          realtime_start. FRED adds a row only when a value changes. Append only.
          Copyright Ramp Business Corporation, citation required.
        config:
          # Monthly series, and the ingest appends only new vintages, so loaded_at
          # doesn't move between releases. Check the vintage date instead.
          loaded_at_field: CAST(realtime_start AS TIMESTAMP)
          freshness:
            warn_after: {count: 40, period: day}
            error_after: {count: 70, period: day}
